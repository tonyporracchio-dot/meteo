<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meteo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #1e2233 0%, #0d0f1a 70%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #e6e8ef;
  }
  .card {
    background: rgba(30, 34, 51, 0.75);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 22px;
    padding: 30px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    text-align: center;
  }
  h1 { font-size: 1.3rem; margin-bottom: 20px; color: #f2f3f7; font-weight: 600; }
  .section-title {
    text-align: left;
    font-size: 0.85rem;
    color: #9aa0b4;
    margin: 22px 0 10px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .search-box {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    font-size: 1rem;
    background: rgba(255,255,255,0.06);
    color: #f2f3f7;
  }
  input::placeholder { color: #767c92; }
  input:focus { outline: none; border-color: #5b8cff; }
  button {
    padding: 10px 18px;
    border: none;
    border-radius: 12px;
    background: #5b8cff;
    color: white;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: #4874e0; }
  .location-btn {
    background: none;
    color: #8fa8ff;
    text-decoration: underline;
    font-size: 0.85rem;
    padding: 5px;
    margin-bottom: 6px;
  }
  .location-btn:hover { background: none; color: #b1c2ff; }

  .icon { font-size: 4rem; line-height: 1; }
  .city { font-size: 1.2rem; color: #d5d8e4; margin: 6px 0 2px; }
  .temp { font-size: 3.5rem; font-weight: 700; color: #f2f3f7; }
  .desc { font-size: 1rem; color: #9aa0b4; margin-bottom: 15px; }
  .details {
    display: flex;
    justify-content: space-around;
    margin-top: 15px;
    padding-top: 15px;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 0.9rem;
    color: #c3c6d4;
  }
  .details span { display: flex; flex-direction: column; gap: 3px; }
  .details small { color: #767c92; font-size: 0.7rem; }

  .hourly-scroll {
    display: flex;
    overflow-x: auto;
    gap: 16px;
    padding-bottom: 8px;
  }
  .hourly-item {
    flex: 0 0 auto;
    text-align: center;
    font-size: 0.8rem;
    color: #c3c6d4;
    min-width: 46px;
  }
  .hourly-item .h-icon { font-size: 1.6rem; margin: 4px 0; }
  .hourly-item .h-rain { font-size: 0.7rem; color: #5b8cff; margin-top: 2px; }

  .daily-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 6px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size: 0.9rem;
    text-align: left;
    cursor: pointer;
    border-radius: 8px;
    transition: background 0.15s ease;
  }
  .daily-row:hover { background: rgba(255,255,255,0.05); }
  .daily-row:last-child { border-bottom: none; }
  .daily-day { flex: 1.1; color: #e6e8ef; font-weight: 500; }
  .daily-icon { flex: 0.5; font-size: 1.3rem; }
  .daily-rain { flex: 0.9; font-size: 0.8rem; color: #5b8cff; text-align: center; }
  .daily-temps { flex: 1; text-align: right; color: #c3c6d4; }
  .daily-temps .max { font-weight: 600; color: #f2f3f7; }

  #radarMap {
    height: 300px;
    border-radius: 14px;
    margin-top: 10px;
  }
  .radar-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
    font-size: 0.8rem;
    color: #9aa0b4;
  }
  .radar-controls button {
    padding: 4px 12px;
    font-size: 0.8rem;
  }

  .error { color: #ff6b6b; font-size: 0.9rem; margin-top: 10px; }
  .loading { color: #9aa0b4; margin-top: 10px; }

  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: rgba(24, 27, 41, 0.97);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .modal-header h2 { font-size: 1.05rem; color: #f2f3f7; }
  .modal-close {
    background: none;
    color: #9aa0b4;
    font-size: 1.2rem;
    padding: 2px 8px;
  }
  .modal-close:hover { background: none; color: #fff; }
  .modal-hour-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 4px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size: 0.9rem;
  }
  .modal-hour-row:last-child { border-bottom: none; }
  .mh-time { flex: 0.8; color: #e6e8ef; }
  .mh-icon { flex: 0.6; font-size: 1.3rem; text-align: center; }
  .mh-temp { flex: 0.8; text-align: center; color: #f2f3f7; font-weight: 500; }
  .mh-rain { flex: 1; text-align: right; color: #5b8cff; font-size: 0.8rem; }
</style>
</head>
<body>

<div class="card">
  <h1>🌤️ Meteo</h1>

  <div class="search-box">
    <input type="text" id="cityInput" placeholder="Nome città..." />
    <button onclick="searchCity()">Cerca</button>
  </div>
  <button class="location-btn" onclick="useMyLocation()">📍 Usa la mia posizione</button>

  <div id="result"></div>

  <div id="hourlySection" style="display:none;">
    <div class="section-title">Previsioni orarie</div>
    <div class="hourly-scroll" id="hourlyScroll"></div>
  </div>

  <div id="dailySection" style="display:none;">
    <div class="section-title">Previsioni prossimi giorni</div>
    <div id="dailyList"></div>
  </div>

  <div id="radarSection" style="display:none;">
    <div class="section-title">Radar precipitazioni</div>
    <div id="radarMap"></div>
    <div class="radar-controls">
      <button onclick="radarStep(-1)">◀</button>
      <span id="radarTime">--:--</span>
      <button onclick="radarStep(1)">▶</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="dayModal">
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="modalTitle">Previsione oraria</h2>
      <button class="modal-close" onclick="closeDayModal()">✕</button>
    </div>
    <div id="modalHourly"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let lastData = null;

async function useMyLocation() {
  if (!navigator.geolocation) {
    showError("Geolocalizzazione non supportata dal browser.");
    return;
  }
  showLoading();
  navigator.geolocation.getCurrentPosition(
    (pos) => getWeather(pos.coords.latitude, pos.coords.longitude, "La tua posizione"),
    () => showError("Impossibile ottenere la posizione.")
  );
}

async function searchCity() {
  const city = document.getElementById('cityInput').value.trim();
  if (!city) return;
  showLoading();
  try {
    const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=it`);
    const geoData = await geoRes.json();
    if (!geoData.results || geoData.results.length === 0) {
      showError("Città non trovata.");
      return;
    }
    const { latitude, longitude, name } = geoData.results[0];
    getWeather(latitude, longitude, name);
  } catch (e) {
    showError("Errore nella ricerca della città.");
  }
}

async function getWeather(lat, lon, placeName) {
  try {
    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code,precipitation_probability,precipitation,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max&timezone=auto&forecast_days=7&models=ecmwf_ifs025`);
    const data = await res.json();
    lastData = data;
    renderWeather(data, placeName);
    renderHourly(data);
    renderDaily(data);
    initRadar(lat, lon);
  } catch (e) {
    showError("Errore nel recupero dei dati meteo.");
  }
}

function renderHourly(data) {
  const now = new Date();
  const times = data.hourly.time;
  const temps = data.hourly.temperature_2m;
  const codes = data.hourly.weather_code;
  const rainProb = data.hourly.precipitation_probability;
  const rainMm = data.hourly.precipitation;

  let startIdx = times.findIndex(t => new Date(t) >= now);
  if (startIdx === -1) startIdx = 0;

  let html = '';
  for (let i = startIdx; i < startIdx + 24 && i < times.length; i++) {
    const hour = new Date(times[i]).getHours();
    const [icon] = weatherInfo(codes[i], hour);
    html += `
      <div class="hourly-item">
        <div>${hour}:00</div>
        <div class="h-icon">${icon}</div>
        <div>${Math.round(temps[i])}°</div>
        <div class="h-rain">💧${rainProb[i]}%</div>
        <div class="h-rain">${rainMm[i].toFixed(1)}mm</div>
      </div>
    `;
  }
  document.getElementById('hourlyScroll').innerHTML = html;
  document.getElementById('hourlySection').style.display = 'block';
}

function renderDaily(data) {
  const days = data.daily.time;
  const codes = data.daily.weather_code;
  const max = data.daily.temperature_2m_max;
  const min = data.daily.temperature_2m_min;
  const rainSum = data.daily.precipitation_sum;
  const dayNames = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];

  let html = '';
  for (let i = 0; i < days.length; i++) {
    const d = new Date(days[i]);
    const label = i === 0 ? 'Oggi' : dayNames[d.getDay()];
    const [icon] = weatherInfo(codes[i], 12);
    html += `
      <div class="daily-row" onclick="openDayModal(${i})">
        <div class="daily-day">${label}</div>
        <div class="daily-icon">${icon}</div>
        <div class="daily-rain">💧 ${rainSum[i].toFixed(1)}mm</div>
        <div class="daily-temps"><span class="max">${Math.round(min[i])}°</span> / ${Math.round(max[i])}°</div>
      </div>
    `;
  }
  document.getElementById('dailyList').innerHTML = html;
  document.getElementById('dailySection').style.display = 'block';
}

function openDayModal(dayIndex) {
  if (!lastData) return;
  const dayDate = lastData.daily.time[dayIndex];
  const times = lastData.hourly.time;
  const temps = lastData.hourly.temperature_2m;
  const codes = lastData.hourly.weather_code;
  const rainProb = lastData.hourly.precipitation_probability;
  const rainMm = lastData.hourly.precipitation;
  const wind = lastData.hourly.wind_speed_10m;

  const dayNames = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
  const d = new Date(dayDate);
  document.getElementById('modalTitle').textContent = dayIndex === 0 ? 'Oggi' : dayNames[d.getDay()];

  let html = '';
  for (let i = 0; i < times.length; i++) {
    if (!times[i].startsWith(dayDate)) continue;
    const hour = new Date(times[i]).getHours();
    const [icon] = weatherInfo(codes[i], hour);
    html += `
      <div class="modal-hour-row">
        <div class="mh-time">${hour}:00</div>
        <div class="mh-icon">${icon}</div>
        <div class="mh-temp">${Math.round(temps[i])}°</div>
        <div class="mh-rain">💧${rainProb[i]}% · ${rainMm[i].toFixed(1)}mm · 💨${Math.round(wind[i])}km/h</div>
      </div>
    `;
  }
  document.getElementById('modalHourly').innerHTML = html;
  document.getElementById('dayModal').classList.add('open');
}

function closeDayModal() {
  document.getElementById('dayModal').classList.remove('open');
}

// --- Radar (RainViewer, gratis senza API key) ---
let radarMapInstance = null;
let radarLayer = null;
let radarFrames = [];
let radarFrameIndex = 0;

async function initRadar(lat, lon) {
  document.getElementById('radarSection').style.display = 'block';

  if (!radarMapInstance) {
    radarMapInstance = L.map('radarMap').setView([lat, lon], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(radarMapInstance);
    L.marker([lat, lon]).addTo(radarMapInstance);
  } else {
    radarMapInstance.setView([lat, lon], 6);
  }

  try {
    const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
    const data = await res.json();
    radarFrames = data.radar.past.concat(data.radar.nowcast || []);
    radarFrameIndex = data.radar.past.length - 1;
    showRadarFrame();
  } catch (e) {
    console.error('Radar non disponibile', e);
  }
}

function showRadarFrame() {
  if (!radarFrames.length) return;
  const frame = radarFrames[radarFrameIndex];
  if (radarLayer) radarMapInstance.removeLayer(radarLayer);
  radarLayer = L.tileLayer(`https://tilecache.rainviewer.com${frame.path}/256/{z}/{x}/{y}/2/1_1.png`, {
    opacity: 0.6
  }).addTo(radarMapInstance);
  const t = new Date(frame.time * 1000);
  document.getElementById('radarTime').textContent = t.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
}

function radarStep(dir) {
  if (!radarFrames.length) return;
  radarFrameIndex = Math.max(0, Math.min(radarFrames.length - 1, radarFrameIndex + dir));
  showRadarFrame();
}

function weatherInfo(code, hour) {
  const isNight = hour !== undefined && (hour >= 21 || hour < 6);
  const map = {
    0: isNight ? ["🌙", "Sereno"] : ["☀️", "Sereno"],
    1: isNight ? ["🌙", "Poco nuvoloso"] : ["🌤️", "Poco nuvoloso"],
    2: isNight ? ["☁️", "Parzialmente nuvoloso"] : ["⛅", "Parzialmente nuvoloso"],
    3: ["☁️", "Nuvoloso"], 45: ["🌫️", "Nebbia"], 48: ["🌫️", "Nebbia gelata"],
    51: ["🌦️", "Pioggerella leggera"], 53: ["🌦️", "Pioggerella"], 55: ["🌧️", "Pioggerella intensa"],
    61: ["🌧️", "Pioggia leggera"], 63: ["🌧️", "Pioggia"], 65: ["🌧️", "Pioggia intensa"],
    71: ["🌨️", "Neve leggera"], 73: ["🌨️", "Neve"], 75: ["❄️", "Neve intensa"],
    80: ["🌦️", "Rovesci leggeri"], 81: ["🌧️", "Rovesci"], 82: ["⛈️", "Rovesci violenti"],
    95: ["⛈️", "Temporale"], 96: ["⛈️", "Temporale con grandine"], 99: ["⛈️", "Temporale forte"]
  };
  return map[code] || ["🌡️", "Condizioni sconosciute"];
}

function renderWeather(data, placeName) {
  const c = data.current;
  const currentHour = new Date().getHours();
  const [icon, desc] = weatherInfo(c.weather_code, currentHour);
  document.getElementById('result').innerHTML = `
    <div class="icon">${icon}</div>
    <div class="city">${placeName}</div>
    <div class="temp">${Math.round(c.temperature_2m)}°C</div>
    <div class="desc">${desc}</div>
    <div class="details">
      <span>💧 ${c.relative_humidity_2m}%<small>Umidità</small></span>
      <span>💨 ${Math.round(c.wind_speed_10m)} km/h<small>Vento</small></span>
    </div>
  `;
}

function showLoading() {
  document.getElementById('result').innerHTML = '<div class="loading">Caricamento...</div>';
}

function showError(msg) {
  document.getElementById('result').innerHTML = `<div class="error">${msg}</div>`;
}

document.getElementById('cityInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') searchCity();
});

document.getElementById('dayModal').addEventListener('click', (e) => {
  if (e.target.id === 'dayModal') closeDayModal();
});

// Avvio automatico: mostra il meteo della posizione dell'utente
useMyLocation();
</script>

</body>
</html>
