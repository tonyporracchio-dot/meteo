<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html {
    background: radial-gradient(circle at top, #1e2233 0%, #0d0f1a 70%);
    background-color: #0d0f1a;
    overflow-x: hidden;
    height: 100%;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #1e2233 0%, #0d0f1a 70%);
    background-color: #0d0f1a;
    min-height: 100vh;
    min-height: 100dvh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    color: #e6e8ef;
    overflow-x: hidden;
  }
  .card {
    background: rgba(30, 34, 51, 0.75);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 22px;
    padding: 30px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    text-align: center;
  }
  h1 { font-size: 1.3rem; margin-bottom: 20px; color: #f2f3f7; font-weight: 600; }
  .section-title {
    text-align: left;
    font-size: 0.85rem;
    color: #9aa0b4;
    margin: 22px 0 10px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .search-box {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    width: 100%;
  }
  input {
    flex: 1;
    min-width: 0;
    padding: 10px 14px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    font-size: 16px;
    background: rgba(255,255,255,0.06);
    color: #f2f3f7;
  }
  input::placeholder { color: #767c92; }
  input:focus { outline: none; border-color: #5b8cff; }
  button {
    padding: 10px 18px;
    border: none;
    border-radius: 12px;
    background: #5b8cff;
    color: white;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: #4874e0; }
  .search-btn {
    background: rgba(255,255,255,0.08);
    color: #c3c6d4;
    font-size: 0.95rem;
  }
  .search-btn:hover { background: rgba(255,255,255,0.15); }
  .location-icon-btn {
    background: rgba(255,255,255,0.05);
    color: #767c92;
    padding: 10px 12px;
    font-size: 0.95rem;
  }
  .location-icon-btn:hover { background: rgba(255,255,255,0.1); color: #9aa0b4; }

  .icon { font-size: 4rem; line-height: 1; }
  .city { font-size: 1.2rem; color: #d5d8e4; margin: 6px 0 2px; }
  .temp { font-size: 3.5rem; font-weight: 700; color: #f2f3f7; }
  .desc { font-size: 1rem; color: #9aa0b4; margin-bottom: 15px; }
  .details {
    display: flex;
    justify-content: space-around;
    margin-top: 15px;
    padding-top: 15px;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 0.9rem;
    color: #c3c6d4;
  }
  .details span { display: flex; flex-direction: column; gap: 3px; }
  .details small { color: #767c92; font-size: 0.7rem; }

  .hourly-scroll {
    display: flex;
    overflow-x: auto;
    gap: 16px;
    padding-bottom: 8px;
  }
  .hourly-item {
    flex: 0 0 auto;
    text-align: center;
    font-size: 0.8rem;
    color: #c3c6d4;
    min-width: 46px;
  }
  .hourly-item .h-icon { font-size: 1.6rem; margin: 4px 0; }
  .hourly-item .h-rain { font-size: 0.7rem; color: #5b8cff; margin-top: 2px; }

  .daily-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 6px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size: 0.9rem;
    text-align: left;
    cursor: pointer;
    border-radius: 8px;
    transition: background 0.15s ease;
  }
  .daily-row:hover { background: rgba(255,255,255,0.05); }
  .daily-row:last-child { border-bottom: none; }
  .daily-day { flex: 1.1; color: #e6e8ef; font-weight: 500; }
  .daily-icon { flex: 0.5; font-size: 1.3rem; }
  .daily-rain { flex: 0.9; font-size: 0.8rem; color: #5b8cff; text-align: center; }
  .daily-temps { flex: 1; text-align: right; color: #c3c6d4; }
  .daily-temps .max { font-weight: 600; color: #f2f3f7; }

  .section-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 22px 0 10px;
  }
  .section-title-row .section-title { margin: 0; }
  .fullscreen-btn {
    background: rgba(255,255,255,0.08);
    color: #c3c6d4;
    font-size: 0.75rem;
    padding: 5px 10px;
    border-radius: 8px;
  }
  .fullscreen-btn:hover { background: rgba(255,255,255,0.15); }
  .radar-modal-box { max-width: 700px; }

  .error { color: #ff6b6b; font-size: 0.9rem; margin-top: 10px; }
  .loading { color: #9aa0b4; margin-top: 10px; }

  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: rgba(24, 27, 41, 0.97);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .modal-header h2 { font-size: 1.05rem; color: #f2f3f7; }
  .modal-close {
    background: none;
    color: #9aa0b4;
    font-size: 1.2rem;
    padding: 2px 8px;
  }
  .modal-close:hover { background: none; color: #fff; }
  .modal-hour-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 4px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size: 0.9rem;
  }
  .modal-hour-row:last-child { border-bottom: none; }
  .mh-time { flex: 0.8; color: #e6e8ef; }
  .mh-icon { flex: 0.6; font-size: 1.3rem; text-align: center; }
  .mh-temp { flex: 0.8; text-align: center; color: #f2f3f7; font-weight: 500; }
  .mh-rain { flex: 1; text-align: right; color: #5b8cff; font-size: 0.8rem; }
</style>
</head>
<body>

<div class="card">
  <h1>🌤️ Meteo</h1>

  <div class="search-box">
    <button class="location-icon-btn" onclick="useMyLocation()" title="Usa la mia posizione">📍</button>
    <input type="text" id="cityInput" placeholder="Nome città..." />
    <button class="search-btn" onclick="searchCity()">Cerca</button>
  </div>

  <div id="result"></div>

  <div id="hourlySection" style="display:none;">
    <div class="section-title">Previsioni orarie</div>
    <div class="hourly-scroll" id="hourlyScroll"></div>
  </div>

  <div id="dailySection" style="display:none;">
    <div class="section-title">Previsioni prossimi giorni</div>
    <div id="dailyList"></div>
  </div>

  <div id="windySection" style="display:none;">
    <div class="section-title-row">
      <div class="section-title">Radar</div>
      <button class="fullscreen-btn" onclick="openRadarFullscreen()">⛶ Schermo intero</button>
    </div>
    <iframe id="windyFrame" style="width:100%; height:300px; border:none; border-radius:14px;" loading="lazy"></iframe>
  </div>
</div>

<div class="modal-overlay" id="radarModal">
  <div class="modal-box radar-modal-box">
    <div class="modal-header">
      <h2>Radar precipitazioni</h2>
      <button class="modal-close" onclick="closeRadarFullscreen()">✕</button>
    </div>
    <iframe id="windyFrameFull" style="width:100%; height:70vh; border:none; border-radius:14px;" loading="lazy"></iframe>
  </div>
</div>

<div class="modal-overlay" id="dayModal">
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="modalTitle">Previsione oraria</h2>
      <button class="modal-close" onclick="closeDayModal()">✕</button>
    </div>
    <div id="modalHourly"></div>
  </div>
</div>

<script>
let lastData = null;

async function useMyLocation() {
  if (!navigator.geolocation) {
    showError("Geolocalizzazione non supportata dal browser.", true);
    return;
  }
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
    showError("La geolocalizzazione richiede HTTPS. Apri l'app dal link GitHub Pages, non da file locale.", true);
    return;
  }
  showLoading();
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const placeName = await reverseGeocode(lat, lon);
      getWeather(lat, lon, placeName);
    },
    (err) => {
      let msg = "Impossibile ottenere la posizione.";
      if (err.code === 1) msg = "Permesso negato. Controlla Impostazioni → Privacy → Localizzazione su iPhone.";
      else if (err.code === 2) msg = "Posizione non disponibile al momento.";
      else if (err.code === 3) msg = "Richiesta scaduta. Riprova.";
      showError(msg, true);
    },
    { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 }
  );
}

async function reverseGeocode(lat, lon) {
  try {
    const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=it`);
    const data = await res.json();
    return data.city || data.locality || data.principalSubdivision || "Posizione attuale";
  } catch (e) {
    return "Posizione attuale";
  }
}

async function searchCity() {
  const city = document.getElementById('cityInput').value.trim();
  if (!city) return;
  showLoading();
  try {
    const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=it`);
    const geoData = await geoRes.json();
    if (!geoData.results || geoData.results.length === 0) {
      showError("Città non trovata.");
      return;
    }
    const { latitude, longitude, name } = geoData.results[0];
    getWeather(latitude, longitude, name);
  } catch (e) {
    showError("Errore nella ricerca della città.");
  }
}

async function getWeather(lat, lon, placeName) {
  try {
    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code,precipitation_probability,precipitation,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max&timezone=auto&forecast_days=7&models=ecmwf_ifs025`);
    const data = await res.json();
    lastData = data;
    renderWeather(data, placeName);
    renderHourly(data);
    renderDaily(data);
    loadWindyWidget(lat, lon);
  } catch (e) {
    showError("Errore nel recupero dei dati meteo.");
  }
}

function renderHourly(data) {
  const now = new Date();
  const times = data.hourly.time;
  const temps = data.hourly.temperature_2m;
  const codes = data.hourly.weather_code;
  const rainProb = data.hourly.precipitation_probability;
  const rainMm = data.hourly.precipitation;

  let startIdx = times.findIndex(t => new Date(t) >= now);
  if (startIdx === -1) startIdx = 0;

  let html = '';
  for (let i = startIdx; i < startIdx + 24 && i < times.length; i++) {
    const hour = new Date(times[i]).getHours();
    const [icon] = weatherInfo(codes[i], hour);
    const willRain = rainProb[i] >= 10 && rainMm[i] >= 0.3;
    const rainHtml = willRain ? `
        <div class="h-rain">💧${rainProb[i]}%</div>
        <div class="h-rain">${rainMm[i].toFixed(1)}mm</div>` : '';
    html += `
      <div class="hourly-item">
        <div>${hour}:00</div>
        <div class="h-icon">${icon}</div>
        <div>${Math.round(temps[i])}°</div>${rainHtml}
      </div>
    `;
  }
  document.getElementById('hourlyScroll').innerHTML = html;
  document.getElementById('hourlySection').style.display = 'block';
}

function renderDaily(data) {
  const days = data.daily.time;
  const codes = data.daily.weather_code;
  const max = data.daily.temperature_2m_max;
  const min = data.daily.temperature_2m_min;
  const rainSum = data.daily.precipitation_sum;
  const rainProbMax = data.daily.precipitation_probability_max;
  const dayNames = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];

  let html = '';
  for (let i = 0; i < days.length; i++) {
    const d = new Date(days[i]);
    const label = i === 0 ? 'Oggi' : dayNames[d.getDay()];
    const [icon] = weatherInfo(codes[i], 12);
    const willRain = rainProbMax[i] >= 10 && rainSum[i] >= 0.3;
    const rainHtml = willRain
      ? `<div class="daily-rain">💧 ${rainProbMax[i]}% · ${rainSum[i].toFixed(1)}mm</div>`
      : `<div class="daily-rain"></div>`;
    html += `
      <div class="daily-row" onclick="openDayModal(${i})">
        <div class="daily-day">${label}</div>
        <div class="daily-icon">${icon}</div>
        ${rainHtml}
        <div class="daily-temps"><span class="max">${Math.round(min[i])}°</span> / ${Math.round(max[i])}°</div>
      </div>
    `;
  }
  document.getElementById('dailyList').innerHTML = html;
  document.getElementById('dailySection').style.display = 'block';
}

function openDayModal(dayIndex) {
  if (!lastData) return;
  const dayDate = lastData.daily.time[dayIndex];
  const times = lastData.hourly.time;
  const temps = lastData.hourly.temperature_2m;
  const codes = lastData.hourly.weather_code;
  const rainProb = lastData.hourly.precipitation_probability;
  const rainMm = lastData.hourly.precipitation;
  const wind = lastData.hourly.wind_speed_10m;

  const dayNames = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
  const d = new Date(dayDate);
  document.getElementById('modalTitle').textContent = dayIndex === 0 ? 'Oggi' : dayNames[d.getDay()];

  let html = '';
  for (let i = 0; i < times.length; i++) {
    if (!times[i].startsWith(dayDate)) continue;
    const hour = new Date(times[i]).getHours();
    const [icon] = weatherInfo(codes[i], hour);
    const willRain = rainProb[i] >= 10 && rainMm[i] >= 0.3;
    const rainPart = willRain ? `💧${rainProb[i]}% · ${rainMm[i].toFixed(1)}mm` : '';
    html += `
      <div class="modal-hour-row">
        <div class="mh-time">${hour}:00</div>
        <div class="mh-icon">${icon}</div>
        <div class="mh-temp">${Math.round(temps[i])}°</div>
        <div class="mh-rain">${rainPart}</div>
      </div>
    `;
  }
  document.getElementById('modalHourly').innerHTML = html;
  document.getElementById('dayModal').classList.add('open');
}

function closeDayModal() {
  document.getElementById('dayModal').classList.remove('open');
}

let lastWindyUrl = '';

function loadWindyWidget(lat, lon) {
  const url = `https://embed.windy.com/embed2.html?lat=${lat}&lon=${lon}&detailLat=${lat}&detailLon=${lon}&width=650&height=450&zoom=9&level=surface&overlay=radar&product=radar&menu=&message=true&marker=true&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=default&metricTemp=default&radarRange=-1`;
  lastWindyUrl = url;
  document.getElementById('windyFrame').src = url;
  document.getElementById('windySection').style.display = 'block';
}

function openRadarFullscreen() {
  document.getElementById('windyFrameFull').src = lastWindyUrl;
  document.getElementById('radarModal').classList.add('open');
}

function closeRadarFullscreen() {
  document.getElementById('radarModal').classList.remove('open');
  document.getElementById('windyFrameFull').src = '';
}

function weatherInfo(code, hour) {
  const isNight = hour !== undefined && (hour >= 21 || hour < 6);
  const map = {
    0: isNight ? ["🌙", "Sereno"] : ["☀️", "Sereno"],
    1: isNight ? ["🌙", "Poco nuvoloso"] : ["🌤️", "Poco nuvoloso"],
    2: isNight ? ["☁️", "Parzialmente nuvoloso"] : ["⛅", "Parzialmente nuvoloso"],
    3: ["☁️", "Nuvoloso"], 45: ["🌫️", "Nebbia"], 48: ["🌫️", "Nebbia gelata"],
    51: isNight ? ["🌧️", "Pioggerella leggera"] : ["🌦️", "Pioggerella leggera"],
    53: isNight ? ["🌧️", "Pioggerella"] : ["🌦️", "Pioggerella"],
    55: ["🌧️", "Pioggerella intensa"],
    61: ["🌧️", "Pioggia leggera"], 63: ["🌧️", "Pioggia"], 65: ["🌧️", "Pioggia intensa"],
    71: ["🌨️", "Neve leggera"], 73: ["🌨️", "Neve"], 75: ["❄️", "Neve intensa"],
    80: isNight ? ["🌧️", "Rovesci leggeri"] : ["🌦️", "Rovesci leggeri"],
    81: ["🌧️", "Rovesci"], 82: ["⛈️", "Rovesci violenti"],
    95: ["⛈️", "Temporale"], 96: ["⛈️", "Temporale con grandine"], 99: ["⛈️", "Temporale forte"]
  };
  return map[code] || ["🌡️", "Condizioni sconosciute"];
}

function renderWeather(data, placeName) {
  const c = data.current;
  const currentHour = new Date().getHours();
  const [icon, desc] = weatherInfo(c.weather_code, currentHour);
  document.getElementById('result').innerHTML = `
    <div class="icon">${icon}</div>
    <div class="city">${placeName}</div>
    <div class="temp">${Math.round(c.temperature_2m)}°C</div>
    <div class="desc">${desc}</div>
    <div class="details">
      <span>💧 ${c.relative_humidity_2m}%<small>Umidità</small></span>
      <span>💨 ${Math.round(c.wind_speed_10m)} km/h<small>Vento</small></span>
    </div>
  `;
}

function showLoading() {
  document.getElementById('result').innerHTML = '<div class="loading">Caricamento...</div>';
}

function showError(msg, showRetryLocation) {
  const retryBtn = showRetryLocation
    ? `<button class="search-btn" style="margin-top:12px;" onclick="useMyLocation()">📍 Riprova</button>`
    : '';
  document.getElementById('result').innerHTML = `<div class="error">${msg}</div>${retryBtn}`;
}

document.getElementById('cityInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') searchCity();
});

document.getElementById('dayModal').addEventListener('click', (e) => {
  if (e.target.id === 'dayModal') closeDayModal();
});

document.getElementById('radarModal').addEventListener('click', (e) => {
  if (e.target.id === 'radarModal') closeRadarFullscreen();
});

// Avvio automatico: mostra il meteo della posizione dell'utente
useMyLocation();
</script>

</body>
</html>
